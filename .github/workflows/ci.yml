name: CI

on:
  push:
  pull_request:

jobs:
  server-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install server dependencies
        working-directory: server
        run: npm install
      - name: Syntax check server.mjs
        working-directory: server
        run: node --check server.mjs
